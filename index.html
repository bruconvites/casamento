<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Convite de Casamento</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#f1e0c8;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#f7ead6 0%,#e9d2b0 100%)}

  .stage{
    position:relative;
    width:min(100vw, calc(100dvh * 941 / 1672));
    aspect-ratio:941/1672;
    container-type:inline-size;
    overflow:hidden;
    background:#fbeedd;
    box-shadow:0 0 40px rgba(90,50,20,.25);
    touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }

  .page{position:absolute;inset:0;display:none;background:#fbeedd}
  .page > img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
  .ov{position:absolute;inset:0;pointer-events:none;z-index:40}

  /* ---------- folha virada (verso do papel) ---------- */
  #flap{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;z-index:3;
    pointer-events:none;display:none;background:#f5e8d0;will-change:transform,clip-path}
  #flap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.15;
    filter:sepia(.5) saturate(.7);pointer-events:none}
  #flap-ov{position:absolute;inset:0}

  /* ---------- dicas discretas ---------- */
  .lbl{position:absolute;bottom:3cqw;z-index:5;pointer-events:none;
    font:italic 600 2.5cqw Georgia,'Times New Roman',serif;color:#7a4a22;
    background:rgba(255,247,232,.78);padding:.9cqw 2.4cqw;border-radius:99px;
    box-shadow:0 1px 4px rgba(80,50,20,.22);opacity:0;transition:opacity .35s}
  .lbl.r{right:11.5cqw}
  .lbl.l{left:11.5cqw}
  .lbl.on{animation:lblp 3s ease-in-out infinite}
  @keyframes lblp{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- primeira página ---------- */
  .hint{position:absolute;left:50%;top:50.4%;transform:translateX(-50%);width:80%;text-align:center;
    font:italic 400 2.6cqw Georgia,'Times New Roman',serif;color:#7a4a22;opacity:.85;
    text-shadow:0 0 4px #fbeedd,0 0 8px #fbeedd;animation:hint 3s ease-in-out infinite;pointer-events:none}
  @keyframes hint{0%,100%{opacity:.45}50%{opacity:.95}}
  .seal-ring{position:absolute;left:49.6%;top:40.85%;width:31%;aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;animation:ring 2.8s ease-out infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(212,165,60,.45)}100%{box-shadow:0 0 0 5cqw rgba(212,165,60,0)}}
  .open-zone{position:absolute;left:0;right:0;top:0;height:52%;cursor:pointer;z-index:10}

  /* ---------- hotspots da página interativa ---------- */
  .hot{position:absolute;cursor:pointer;z-index:10;border-radius:18px}
  #hot-dress{left:17%;top:60.8%;width:30%;height:18%}
  #hot-manual{left:53.5%;top:60.8%;width:31%;height:18%}
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="page" id="p-primeira" data-img="primeira.jpg">
    <img class="bg" src="primeira.jpg" alt="Convite" draggable="false">
    <div class="seal-ring"></div>
    <div class="hint">Clique no selo para abrir o seu convite</div>
    <div class="open-zone" data-go="p-segunda" data-dir="R"></div>
    <div class="ov"></div>
  </div>

  <div class="page" id="p-segunda" data-img="segunda.jpg">
    <img class="bg" src="segunda.jpg" alt="Convidamos você para nosso casamento" draggable="false">
    <div class="ov"></div>
  </div>

  <div class="page" id="p-terceira" data-img="terceira.jpg">
    <img class="bg" src="terceira.jpg" alt="Save the date" draggable="false">
    <div class="ov"></div>
  </div>

  <div class="page" id="p-quarta" data-img="quarta.jpg">
    <img class="bg" src="quarta.jpg" alt="Data e horário" draggable="false">
    <div class="ov"></div>
  </div>

  <div class="page" id="p-interativo" data-img="Interativo.jpg">
    <img class="bg" src="Interativo.jpg" alt="Toque nos ícones para interagir" draggable="false">
    <div class="hot" id="hot-dress" data-go="p-dress" data-dir="R" title="Dress Code"></div>
    <div class="hot" id="hot-manual" data-go="p-manual" data-dir="R" title="Manual dos convidados"></div>
    <div class="ov"></div>
  </div>

  <div class="page" id="p-dress" data-img="dress.jpg">
    <img class="bg" src="dress.jpg" alt="Dress Code" draggable="false">
    <div class="ov"></div>
  </div>

  <div class="page" id="p-manual" data-img="manual.jpg">
    <img class="bg" src="manual.jpg" alt="Manual do Convidado" draggable="false">
    <div class="ov"></div>
  </div>

  <div id="flap"><img id="flap-img" alt="" draggable="false"><div id="flap-ov"></div></div>

  <div class="lbl r" id="lbl-r">puxe aqui</div>
  <div class="lbl l" id="lbl-l">voltar</div>
</div>

<audio id="music" src="audio.mp3" loop preload="auto" playsinline></audio>

// música de fundo: começa no primeiro toque/clique em qualquer lugar (exigência de iOS, Android e desktop)
var musicOn = false;
function startMusic(){
  if(musicOn) return;
  var p;
  try{ p = music.play(); }catch(e){ return; }
  if(p && p.then){
    p.then(function(){ musicOn = true; }).catch(function(){ musicOn = false; });
  } else { musicOn = true; }
}
music.addEventListener('pause', function(){ musicOn = false; });
music.addEventListener('ended', function(){ musicOn = false; startMusic(); });
['pointerup','touchend','click','keydown'].forEach(function(ev){
  document.addEventListener(ev, startMusic, true);
});
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) startMusic();
});

/* ====================== GEOMETRIA DO CURL ====================== */
function clipHalf(poly, mx, my, nx, ny, keepNeg){
  var out = [], len = poly.length;
  for(var i = 0; i < len; i++){
    var A = poly[i], B = poly[(i+1) % len];
    var fa = (A[0]-mx)*nx + (A[1]-my)*ny;
    var fb = (B[0]-mx)*nx + (B[1]-my)*ny;
    if(!keepNeg){ fa = -fa; fb = -fb; }
    var ina = fa <= 0, inb = fb <= 0;
    if(ina) out.push(A);
    if(ina !== inb){
      var t = fa / (fa - fb);
      out.push([A[0] + (B[0]-A[0])*t, A[1] + (B[1]-A[1])*t]);
    }
  }
  return out;
}
function polyStr(pts){
  return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px'; }).join(',') + ')';
}

  var s = 0;
  for(var i = 0; i < pts.length; i++){
    var A = pts[i], B = pts[(i+1) % pts.length];
    s += A[0]*B[1] - B[0]*A[1];
  }
  return Math.abs(s) / 2;
}
function setClip(el, v){ el.style.clipPath = v; el.style.webkitClipPath = v; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function restP(dir, a){ return dir === 'R' ? [W - a, H - a*0.75] : [a, H - a*0.75]; }
function endP(dir){ return dir === 'R' ? [-1.1*W, H] : [3.1*W - W, H]; }

function resetPage(p){
  setClip(p, '');
  p.style.visibility = '';
  p.querySelector('.ov').style.background = 'none';
}
function showPage(p, role){
  p.style.display = 'block';
  if(role === 'cur'){ p.style.zIndex = 2; p.style.pointerEvents = 'auto'; }
  else { p.style.zIndex = 1; p.style.pointerEvents = 'none'; }
}

/* Desenha a página "cur" com o canto virado.
   dir: 'R' (canto inferior direito) ou 'L' (inferior esquerdo)
   P: posição onde o dedo está puxando o canto */
function render(dir, underId, P){
  var curP = pages[cur];
  var underP = underId ? pages[underId] : null;
  var Cx = dir === 'R' ? W : 0, Cy = H;
  var vx = Cx - P[0], vy = Cy - P[1];
  var len = Math.sqrt(vx*vx + vy*vy);

  if(len < 1){
    setClip(curP, ''); curP.style.visibility = ''; flap.style.display = 'none';
    curP.querySelector('.ov').style.background = 'none';
    if(underP) underP.querySelector('.ov').style.background = 'none';
    return;
  }

  var nx = vx/len, ny = vy/len;
  var mx = (Cx + P[0]) / 2, my = (Cy + P[1]) / 2;
  var rect = [[0,0],[W,0],[W,H],[0,H]];
  var flat = clipHalf(rect, mx, my, nx, ny, true);
  var cut  = clipHalf(rect, mx, my, nx, ny, false);

  // parte da folha que continua plana
  if(flat.length < 3){ curP.style.visibility = 'hidden'; }
  else { curP.style.visibility = ''; setClip(curP, polyStr(flat)); }

  // sombreamento
  var angle = Math.atan2(nx, -ny) * 180 / Math.PI;
  var Ln = Math.abs(W*nx) + Math.abs(H*ny);
  var sF = (mx - W/2)*nx + (my - H/2)*ny + Ln/2;
  var areaFlat = flat.length >= 3 ? polyArea(flat) / (W*H) : 0;
  var k = Math.min(1, len / (0.1*W)) * Math.min(1, areaFlat * 5);

  var sl  = clamp(len*0.5, 14, 0.22*W);
  var sl2 = clamp(len*0.35, 10, 0.12*W);
  curP.querySelector('.ov').style.background =
    'linear-gradient(' + angle + 'deg, rgba(0,0,0,0) ' + (sF - sl2) + 'px, rgba(0,0,0,' + (0.28*k) + ') ' + sF + 'px)';
  if(underP){
    underP.querySelector('.ov').style.background =
      'linear-gradient(' + angle + 'deg, rgba(0,0,0,' + (0.42*k) + ') ' + sF + 'px, rgba(0,0,0,0) ' + (sF + sl) + 'px)';
  }

  // verso da folha (reflexo da parte cortada)
  if(cut.length < 3){ flap.style.display = 'none'; return; }
  var half = len / 2;
  var dotMn = mx*nx + my*ny;
  var m = 'matrix(' + (1-2*nx*nx) + ',' + (-2*nx*ny) + ',' + (-2*nx*ny) + ',' + (1-2*ny*ny) + ',' +
          (2*dotMn*nx) + ',' + (2*dotMn*ny) + ')';
  flap.style.display = 'block';
  flap.style.transform = m;
  setClip(flap, polyStr(cut));
  flapOv.style.background =
    'linear-gradient(' + angle + 'deg, rgba(0,0,0,0) ' + sF + 'px, rgba(90,55,20,' + (0.34*k) + ') ' + (sF+0.5) + 'px, ' +
    'rgba(255,251,240,' + (0.5*k) + ') ' + (sF + half*0.3) + 'px, rgba(60,35,10,' + (0.12*k) + ') ' + (sF + half) + 'px)';
}

/* ====================== PREPARAÇÃO DE PÁGINAS ====================== */
function setLabels(dir){
  lblR.classList.toggle('on', dir === 'R');
  lblL.classList.toggle('on', dir === 'L');
}
function prepareCurl(under){
  Object.keys(pages).forEach(function(id){
    var p = pages[id];
    resetPage(p);
    if(id === cur) showPage(p, 'cur');
    else if(id === under) showPage(p, 'under');
    else p.style.display = 'none';
  });
  flapImg.src = pages[cur].getAttribute('data-img');
  flap.style.display = 'none';
  setLabels(null);
}
function setupRest(){
  var dir = CORNER[cur] || null;
  var under = dir ? (dir === 'R' ? NEXT[cur] : PREV[cur]) : null;
  curl = dir ? {dir: dir, under: under} : null;
  prepareCurl(under);
  setLabels(dir);
}

/* ====================== ANIMAÇÃO ====================== */
function easeInOut(u){ return u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2; }
function easeOut(u){ return 1 - Math.pow(1 - u, 3); }

function animate(dir, underId, from, to, dur, ease, done){
  state = 'anim';
  setLabels(null);
  var t0 = performance.now();
  function step(now){
    var u = Math.min(1, (now - t0) / dur);
    var e = ease(u);
    render(dir, underId, [from[0] + (to[0]-from[0])*e, from[1] + (to[1]-from[1])*e]);
    if(u < 1) requestAnimationFrame(step); else done();
  }
  requestAnimationFrame(step);
}
function finish(id){
  cur = id;
  state = 'idle';
  drag = null;
  setupRest();
}
// vira a página sozinha (toque no cantinho, no selo, nos ícones ou teclado)
function turn(id, dir){
  if(state === 'anim' || !pages[id]) return;
  prepareCurl(id);
  playFlip();
  animate(dir, id, restP(dir, lastA), endP(dir), 950, easeInOut, function(){ finish(id); });
}

/* ====================== LOOP DO CANTINHO (respiração suave) ====================== */
function loop(now){
  if(state === 'idle' && curl && !document.hidden){
    hover += (hoverTarget - hover) * 0.12;
    var a = W * (0.07 + 0.012*Math.sin(now/500)) + hover * 0.04 * W;
    lastA = a;
    render(curl.dir, curl.under, restP(curl.dir, a));
  }
  requestAnimationFrame(loop);
}

/* ====================== GESTOS ====================== */
stage.addEventListener('pointerdown', function(e){
  if(state !== 'idle') return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  var now = performance.now();
  press = {x: e.clientX, y: e.clientY, id: e.pointerId, target: e.target, samples: [[now, e.clientX]]};
  state = 'press';
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});

stage.addEventListener('pointermove', function(e){
  if(state === 'idle'){
    if(e.pointerType === 'mouse' && curl){
      var r = stage.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top, z = 0.2*W;
      var inZone = (curl.dir === 'R' && x > W - z && y > H - z) || (curl.dir === 'L' && x < z && y > H - z);
      hoverTarget = inZone ? 1 : 0;
      stage.style.cursor = inZone ? 'pointer' : '';
    }
    return;
  }
  if(!press || e.pointerId !== press.id) return;
  var dx = e.clientX - press.x, dy = e.clientY - press.y;
  var now = performance.now();

  if(state === 'press'){
    if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 0.7){
      var dir = dx < 0 ? 'R' : 'L';
      var under = dir === 'R' ? NEXT[cur] : PREV[cur];
      if(!under){ state = 'nodrag'; return; }
      prepareCurl(under);
      drag = {dir: dir, under: under, a0: lastA, P: restP(dir, lastA)};
      state = 'drag';
    } else { return; }
  }
  if(state !== 'drag') return;

  press.samples.push([now, e.clientX]);
  if(press.samples.length > 6) press.samples.shift();

  var base = restP(drag.dir, drag.a0);
  var gain = 1.25;
  var px = base[0] + dx*gain, py = base[1] + dy*gain;
  if(drag.dir === 'R'){ px = clamp(px, -W, W - 4); } else { px = clamp(px, 4, 2*W); }
  py = clamp(py, H*0.15, H - 4);
  drag.P = [px, py];
  render(drag.dir, drag.under, drag.P);
});

function endPress(e, cancelled){
  if(!press || e.pointerId !== press.id) return;
  var st = state, p = press;
  press = null;
  try{ stage.releasePointerCapture(e.pointerId); }catch(err){}

  if(st === 'drag'){
    var dir = drag.dir, under = drag.under, P = drag.P;
    var progress = dir === 'R' ? (W - P[0]) / W : P[0] / W;
    var s = p.samples, toward = 0;
    if(s.length > 1){
      var last = s[s.length-1], old = s[0];
      for(var i = 0; i < s.length; i++){ if(last[0] - s[i][0] <= 150){ old = s[i]; break; } }
      var dt = last[0] - old[0];
      if(dt > 0){ var vx = (last[1] - old[1]) / dt; toward = dir === 'R' ? -vx : vx; }
    }
    var commit = !cancelled && (progress > 0.45 || (toward > 0.45 && progress > 0.1));
    if(commit){
      playFlip();
      animate(dir, under, P, endP(dir), 650, easeOut, function(){ finish(under); });
    } else {
      animate(dir, under, P, restP(dir, drag.a0), 400, easeOut, function(){ finish(cur); });
    }
    return;
  }

  if(st === 'press' && !cancelled){
    state = 'idle';
    var el = (p.target && p.target.closest) ? p.target.closest('[data-go]') : null;
    if(el && pages[cur].contains(el)){
      turn(el.getAttribute('data-go'), el.getAttribute('data-dir') || 'R');
      return;
    }
    if(curl){
      var r = stage.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top, z = 0.2*W;
      if(curl.dir === 'R' && x > W - z && y > H - z) turn(curl.under, 'R');
      else if(curl.dir === 'L' && x < z && y > H - z) turn(curl.under, 'L');
    }
    return;
  }
  state = 'idle';
}
stage.addEventListener('pointerup', function(e){ endPress(e, false); });
stage.addEventListener('pointercancel', function(e){ endPress(e, true); });

document.addEventListener('keydown', function(e){
  if(state !== 'idle') return;
  if(e.key === 'ArrowRight' && NEXT[cur]) turn(NEXT[cur], 'R');
  if(e.key === 'ArrowLeft' && PREV[cur]) turn(PREV[cur], 'L');
});

window.addEventListener('resize', function(){ measure(); if(state === 'idle') setupRest(); });
window.addEventListener('orientationchange', function(){ setTimeout(function(){ measure(); if(state === 'idle') setupRest(); }, 250); });

/* ====================== INÍCIO ====================== */
['primeira','segunda','terceira','quarta','Interativo','dress','manual'].forEach(function(n){
  var im = new Image(); im.src = n + '.jpg';
});
measure();
setupRest();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
